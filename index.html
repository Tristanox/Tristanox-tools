    <style>
        /* Importation de la police Babynotes */
        @font-face {
            font-family: 'Babynotes';
            src: url('https://dl.dafont.com/dl/?f=babynotes') format('truetype');
        }

        /* Réinitialisation globale */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        html {
            background-color: #1E2124;
        }

        body {
            font-family: Arial, sans-serif;
            color: lightgray;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            max-width: 95vw;
            margin: 0 auto;
            padding: 30px;
            background-color: transparent;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        header {
            grid-column: 1 / -1;
            margin-bottom: 40px;
        }

        header img {
            display: block;
            margin: 0 auto 30px auto;
            max-width: 600px;
            height: auto;
            border-radius: 10px;
        }

        /* STYLE POUR LA MINIATURE EN HAUT À DROITE */
        .corner-link {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001; /* Pour être au-dessus du compteur de vues */
            transition: transform 0.3s ease;
        }

        .corner-link img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(158, 255, 158, 0.3);
        }

        .corner-link:hover {
            transform: scale(1.05);
        }

        .game-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: lightgray;
            border-radius: 10px;
            padding: 0;
            background-color: transparent;
            border: 2px solid transparent;
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s ease-out, filter 0.3s ease-out, opacity 0.5s ease-out;
            opacity: 0;
            transform: translateY(20px);
            animation: itemFadeIn 0.6s ease-out forwards;
        }

        /* Délais d'animation */
        body .game-item:nth-child(2) { animation-delay: 0.1s; }
        body .game-item:nth-child(3) { animation-delay: 0.2s; }
        body .game-item:nth-child(4) { animation-delay: 0.3s; }
        body .game-item:nth-child(5) { animation-delay: 0.4s; }
        body .game-item:nth-child(6) { animation-delay: 0.5s; }
        body .game-item:nth-child(7) { animation-delay: 0.6s; }
        body .game-item:nth-child(8) { animation-delay: 0.7s; }
        body .game-item:nth-child(9) { animation-delay: 0.8s; }
        body .game-item:nth-child(10) { animation-delay: 0.9s; }
        body .game-item:nth-child(11) { animation-delay: 1.0s; }
        body .game-item:nth-child(12) { animation-delay: 1.1s; }
        body .game-item:nth-child(13) { animation-delay: 1.2s; }
        body .game-item:nth-child(14) { animation-delay: 1.3s; }
        body .game-item:nth-child(15) { animation-delay: 1.4s; }
        body .game-item:nth-child(16) { animation-delay: 1.5s; }
        body .game-item:nth-child(17) { animation-delay: 1.6s; }
        body .game-item:nth-child(18) { animation-delay: 1.7s; }
        body .game-item:nth-child(19) { animation-delay: 1.8s; }
        body .game-item:nth-child(20) { animation-delay: 1.9s; }
        body .game-item:nth-child(21) { animation-delay: 2.0s; }
        body .game-item:nth-child(22) { animation-delay: 2.1s; }
        body .game-item:nth-child(23) { animation-delay: 2.2s; }
        body .game-item:nth-child(24) { animation-delay: 2.3s; }
        body .game-item:nth-child(25) { animation-delay: 2.4s; }

        @keyframes itemFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-item:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 15px #9eff9e;
            border-color: #9eff9e;
            filter: brightness(1.1);
        }

        .game-item img {
            width: 560px;
            height: 150px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        @media (max-width: 768px) {
            body { grid-template-columns: 1fr; gap: 20px; padding: 15px; }
            header img { max-width: 250px; }
            .game-item img { width: 100%; height: auto; max-height: 200px; }
            .corner-link img { width: 150px; height: 150px; } /* Plus petit sur mobile */
        }

        #hits-counter { position: fixed; top: 10px; left: 10px; z-index: 1000; }
        #hits-counter img { width: 160px; height: auto; border-radius: 5px; }

        footer {

            width: 100%;
            background-color: #1e2124;
            color: lightgray;
            padding: 30px 20px;
            margin-top: 40px;
            text-align: center;

        }

        .social-links a { text-decoration: none; margin: 0 15px; color: inherit; transition: 0.2s; }
        .social-links img { height: 30px; vertical-align: middle; margin-right: 8px; }
        .social-links a:hover { color: #9eff9e; }
    </style>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        const gridSize = 45;
        const pointSize = 1;
        const maxDistance = 71;
        const maxDeformation = 50;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createGrid();
        }

        function createGrid() {
            points = [];
            for (let x = 0; x < canvas.width; x += gridSize) {
                for (let y = 0; y < canvas.height; y += gridSize) {
                    points.push({ x: x, y: y, originalX: x, originalY: y, targetX: x, targetY: y });
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(173, 173, 173, 0.5)';
            ctx.lineWidth = 1;
            points.forEach(point => {
                for (let i = 0; i < points.length; i++) {
                    const otherPoint = points[i];
                    const distance = Math.hypot(point.x - otherPoint.x, point.y - otherPoint.y);
                    if (distance < maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(point.x, point.y);
                        ctx.lineTo(otherPoint.x, otherPoint.y);
                        ctx.stroke();
                    }
                }
            });
            ctx.fillStyle = 'rgba(173, 173, 173, 1)';
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, pointSize, 0, Math.PI * 2);
                ctx.fill();
                point.x += (point.targetX - point.x) * 0.01;
                point.y += (point.targetY - point.y) * 0.01;
                if (Math.random() < 0.003) {
                    point.targetX = point.originalX + (Math.random() - 0.8) * maxDeformation;
                    point.targetY = point.originalY + (Math.random() - 0.8) * maxDeformation;
                }
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animate();
    </script>
